# 프로젝트 템플릿 카탈로그 — 어떤 템플릿이 있는지의 **목록**.
#
# ★ 이 파일은 **집행하지 않는다.** 카탈로그에 있다고 배포되지 않고, fleet 이 배포하는
#   DSC 문서(`{library}/dsc/projects.dsc.yaml`)에 있어야 배포된다. 목록과 집행을 한 파일에
#   섞으면 *"목록에서 지웠는데 왜 아직 있나"* 가 시작된다.
#
# ★ 스키마를 발명하지 않았다 — moum-ops 의 `charts/repo-scaffolds/registry.yaml`
#   (create-moum CLI)이 이미 `engine`/`source`/`description`/`category` 로
#   "내부 copier(업데이트 가능) vs 외부(일회성)" 를 구분한다. 그것을 승계하고 `source` 가
#   **원격 git URL** 을 받도록만 확장했다.
#
# 🔴 **템플릿 콘텐츠는 어떤 서명 covered-set 에도 들어가지 않는다.** 외부 출처를 도입하는
#   것은 **사용자의 결정**이고, 완화는 서명이 아니라 **사용자 리뷰**다 — 템플릿이 만드는 것은
#   사용자 자기 프로젝트의 파일이고, 사용자가 자기 git 에서 diff 로 본다.
#
# 소비자: `Aileaf.Git/Project` DSC 리소스 (github.com/aileaf-co/desk-test2608).
#   그 리소스는 `templateRef` 를 **집행값**으로 쓴다. 아래 `ref` 는 **권장 핀**이며,
#   둘이 갈리면 **문서가 이긴다**(집행하는 쪽이 참).
version: "1"

templates: {}
# 아직 비어 있다 — 실제 템플릿 저장소가 생기면 아래 모양으로 추가한다.
#
#   agent-starter:
#     engine: copier            # copier = `copier update` 로 upstream 갱신을 받는다
#     source: https://github.com/<org>/template-agent.git
#     ref: v1.4.0
#     description: "AI 에이전트 프로젝트 뼈대"
#     category: agent
#
#   infra-starter:
#     engine: external          # external = 일회성 복제. 갱신 경로가 없다 —
#                               #   리소스의 관측이 `updatable: false` 로 그 사실을 보고한다
#     source: https://github.com/<org>/template-infra.git
#     ref: main
#     description: "인프라 정의 뼈대"
#     category: infra
#
# ⚠ `engine: copier` 로 등록하려면 그 템플릿이 **answers 파일을 실어야** 한다
#   (`{{ _copier_conf.answers_file }}.jinja`). Copier 는 템플릿이 그 파일을 포함할 때만
#   `.copier-answers.yml` 을 쓰고, 그게 없으면 `copier update` 자체가 불가능하다.
#   실측으로 확인된 사실이다 — 등록 전에 템플릿을 한 번 렌더해서 그 파일이 나오는지 보라.
